[project]
name = "internship"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.1.7",
    "deprecated>=1.3.1",
    "matplotlib>=3.10.9",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pymultifit>=1.0.9",
    "pyqt6>=6.11.0",
    "scipy>=1.15.3",
    "scipy-stubs~=1.15.3",
    "streamlit>=1.61.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
